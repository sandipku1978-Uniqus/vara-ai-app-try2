name: Accuracy gate

# CI note: GitHub runners share throttled egress to SEC/Supabase, so the e2e
# baseline here is ~94% vs ~98% locally — the 90% CI bar catches real
# regressions (which fail whole classes) without weekly false alarms. The
# ticker sweep below remains a hard 100% gate.
# Weekly proof that search accuracy is still 100%: builds the app, serves it
# locally with the CI/e2e auth bypass (inert on hosted deploys), then runs the
# full 10,426-ticker directory sweep plus the 1,000-point e2e suite against it.
# Fails loudly if any ticker stops resolving or the e2e pass rate regresses.

on:
  schedule:
    - cron: '30 4 * * 1' # Mondays 04:30 UTC, before the daily data refresh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accuracy-gate
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      URC_SUPABASE_URL: ${{ secrets.URC_SUPABASE_URL }}
      URC_SUPABASE_SERVICE_KEY: ${{ secrets.URC_SUPABASE_SERVICE_KEY }}
      # Since #41, web routes fail closed without the publishable key: every
      # /api/es-search call 503s, which the first dispatch of the reworked
      # gate (2026-08-02, run 30771438193) hit as 100% ticker failures. Same
      # value already set in Vercel; here it must be a repo secret.
      URC_SUPABASE_WEB_KEY: ${{ secrets.URC_SUPABASE_WEB_KEY }}
      URC_E2E_BYPASS_AUTH: '1'
      # The local server reports the candidate revision via /api/version, so
      # the consolidation step can prove the evidence describes THIS commit.
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      # npm run build pins NEXT_LOCAL_BUILD=1 (writes .next-build); next start
      # must read the same distDir.
      NEXT_LOCAL_BUILD: '1'
    steps:
      - name: Fail closed if required secrets are absent (WP5)
        run: |
          missing=""
          [ -z "${URC_SUPABASE_URL}" ] && missing="$missing URC_SUPABASE_URL"
          [ -z "${URC_SUPABASE_SERVICE_KEY}" ] && missing="$missing URC_SUPABASE_SERVICE_KEY"
          [ -z "${URC_SUPABASE_WEB_KEY}" ] && missing="$missing URC_SUPABASE_WEB_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Accuracy gate cannot run::Missing repository secrets:$missing. Web routes fail closed without URC_SUPABASE_WEB_KEY (the Supabase publishable key, same value as Vercel) — without it every ticker probe 503s and the report would measure the outage, not accuracy. See docs/pending-keys-checklist.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # supabase-js in the e2e script needs native WebSocket (Node 22+)
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start production server
        run: |
          npx next start -p 3111 &
          for i in $(seq 1 45); do
            curl -sf -o /dev/null http://localhost:3111/ && exit 0
            sleep 2
          done
          echo "Server did not become ready" >&2
          exit 1

      - name: Probe the web read path before the sweep
        # A present-but-invalid URC_SUPABASE_WEB_KEY passes the secrets guard,
        # then 503s all 10,412 probes at ~750ms each (observed 2026-08-02, run
        # 30772616107, 13 wasted minutes). One request settles it up front.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3111/api/es-search?cik=0000320193&size=1")
          if [ "$code" != "200" ]; then
            echo "::error title=Web read path is broken::/api/es-search returned HTTP $code for a known CIK. If 503, URC_SUPABASE_WEB_KEY is present but not a usable key (must be the sb_publishable_… key or the legacy anon JWT — check for clipboard/paste mishaps). The sweep would fail on every probe; aborting now instead."
            exit 1
          fi
          echo "Web read path OK (HTTP $code)."
      - name: Full ticker coverage sweep (100% required)
        run: npx tsx scripts/ticker-coverage-test.ts --base http://localhost:3111 --out ticker-coverage-report.json
      - name: 1,000-point e2e performance suite
        run: npx tsx scripts/e2e-perf-test.ts --base http://localhost:3111 --out e2e-perf-report.json --min-pass 90
      - name: Semantic accuracy gate (SEC-derived expectations)
        run: npx tsx scripts/accuracy/gate.ts --json accuracy-report.json
      - name: Consolidated release evidence (fail-closed)
        # One verdict from separate dimensions — never averaged. Fails when any
        # suite is missing, a critical semantic check was skipped, ticker
        # resolution is below 100%, e2e is under its bar, the tested server
        # reports a different SHA than this run's candidate, or the DATABASE
        # reports a different schema version than the repository's migration
        # chain expects (audit R0/R3: app SHA + schema state are one
        # candidate — this is the assertion that was missing when production
        # ran 016 behavior under 017-expecting code).
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          expected_schema=$(ls db/migrations/ | grep -oE '^[0-9]{3}' | sort | tail -1)
          echo "Repository migration chain expects schema version: $expected_schema"
          npx tsx scripts/accuracy/consolidate.ts \
            --base http://localhost:3111 \
            --semantic accuracy-report.json \
            --tickers ticker-coverage-report.json \
            --e2e e2e-perf-report.json \
            --e2e-min-pass 90 \
            --expect-schema "$expected_schema" \
            --out release-evidence.json
      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            release-evidence.json
            accuracy-report.json
            ticker-coverage-report.json
            e2e-perf-report.json
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Accuracy gate"
            echo '```json'
            [ -f release-evidence.json ] && node -e "const r=require('./release-evidence.json');console.log(JSON.stringify({pass:r.pass,problems:r.problems,dimensions:r.dimensions,sha:r.provenance?.reported?.sha},null,1))" || echo '"release evidence missing"'
            echo '```'
            echo '```json'
            [ -f ticker-coverage-report.json ] && node -e "const r=require('./ticker-coverage-report.json');console.log(JSON.stringify({tickers:r.tickers,pass:r.pass,fail:r.fail,emptyVerified:r.emptyVerified,latency:r.latency,failures:(r.failures||[]).slice(0,20)},null,1))" || echo '"ticker report missing"'
            echo '```'
            echo '```json'
            [ -f e2e-perf-report.json ] && node -e "const r=require('./e2e-perf-report.json');const s=r.summary||r;console.log(JSON.stringify(s,null,1).slice(0,4000))" || echo '"e2e report missing"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
