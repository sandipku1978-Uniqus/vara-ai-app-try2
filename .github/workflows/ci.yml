name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --no-file-parallelism --maxWorkers=1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev

  browser:
    # Deterministic Playwright acceptance: route smoke, neutral visitor,
    # Boolean journeys (SEC-facing calls are intercepted fixtures), and the
    # semantic census — against the PRODUCTION build (PW_PROD_BUILD).
    # Release finding F-04: Vercel promoted revisions whose browser behaviour
    # was never exercised in CI.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: 'true'
          QA_OUTPUT_DIR: ${{ runner.temp }}/urc-playwright
          # Release evidence exercises the production build, not next dev
          # (handoff WP8): what CI proves must be what users get.
          PW_PROD_BUILD: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: ${{ runner.temp }}/urc-playwright/report
          retention-days: 7

  migrations:
    # Readiness audit R0: replay the ENTIRE migration chain from an empty
    # disposable Postgres and assert grants, search_path, deterministic
    # ordering, sentinel totals, clamps, and empty-page behavior — including
    # sentinel-scale seeded data (10,050 rows) so the 10,001 cap is exercised
    # for real. Makes "the migrations produce the schema production should
    # have" a checked claim instead of a belief.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: tests/db/migration-chain.sh
        env:
          DATABASE_URL: postgres://postgres:test@localhost:55432/postgres

  auth-browser:
    # The `browser` job runs behind URC_E2E_BYPASS_AUTH, so it cannot observe
    # authentication at all — nothing is protected there. This job serves the
    # app with the bypass OFF against a Clerk DEVELOPMENT instance, which is
    # the only way global.authentication is provable.
    #
    # It is deliberately NOT a required check: until the Clerk test secrets
    # exist it reports a notice and passes, so main stays green and nobody is
    # blocked by a capability that is not configured yet.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TEST }}
      CLERK_TEST_EMAIL: ${{ secrets.CLERK_TEST_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: gate
        name: Check whether Clerk test credentials are configured
        # Readiness audit R3: the skip-with-notice path existed so the job
        # could land before the secrets did. The secrets exist now (added
        # 2026-08-02), so a missing secret is a BROKEN configuration and the
        # job fails loudly — a silently green non-run of the auth suite is
        # exactly the class of quiet gap this pipeline is built to refuse.
        # Sole carve-out: dependabot PRs never receive repository secrets by
        # GitHub's design, so for that actor alone the suite is skipped with
        # a notice instead of failing every dependency bump.
        run: |
          if [ -z "${CLERK_SECRET_KEY}" ] || [ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" ]; then
            if [ "${GITHUB_ACTOR}" = "dependabot[bot]" ]; then
              echo 'configured=false' >> "$GITHUB_OUTPUT"
              echo '::notice title=Authentication suite skipped for dependabot::Dependabot PRs do not receive repository secrets; the auth suite runs on every other PR.'
            else
              echo '::error title=Clerk test credentials missing::CLERK_PUBLISHABLE_KEY_TEST / CLERK_SECRET_KEY_TEST are configured on this repository (since 2026-08-02) but were not available to this run. A silently skipped auth suite is not a passing auth suite — fix the secret configuration. See docs/pending-keys-checklist.md section 6.'
              exit 1
            fi
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.gate.outputs.configured == 'true'
        run: npx playwright test --config playwright.auth.config.ts
        env:
          CI: 'true'
          QA_OUTPUT_DIR: ${{ runner.temp }}/urc-playwright-auth
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.gate.outputs.configured == 'true'
        with:
          name: playwright-auth-report
          path: ${{ runner.temp }}/urc-playwright-auth/report
          retention-days: 7
