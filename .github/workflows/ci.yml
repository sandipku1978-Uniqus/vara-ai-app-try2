name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enforce an acyclic source dependency graph
        run: npm run check:cycles
      - run: npm test -- --no-file-parallelism --maxWorkers=1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Test/build tooling executes in CI and can expose the repository even
      # when it is not shipped to users, so audit the complete dependency tree.
      - run: npm audit

  browser:
    # Deterministic Playwright acceptance: route smoke, neutral visitor,
    # Boolean journeys (SEC-facing calls are intercepted fixtures), and the
    # semantic census — against the PRODUCTION build (PW_PROD_BUILD).
    # Release finding F-04: Vercel promoted revisions whose browser behaviour
    # was never exercised in CI.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      # The internal component gallery exists only under `next dev`; exercise
      # that acceptance surface explicitly before the production-build suite
      # proves that the fabricated specimens cannot ship.
      - name: Exercise the internal design gallery in development
        run: npx --no-install playwright test tests/e2e/design-gallery-interactions.spec.ts
        env:
          CI: 'true'
          QA_OUTPUT_DIR: ${{ runner.temp }}/urc-playwright-gallery
          QA_ACTION_RUN_LABEL: browser-development
          QA_ACTION_SHA: ${{ github.sha }}
      - name: Exercise the complete production-build browser suite
        run: npx --no-install playwright test
        env:
          CI: 'true'
          QA_OUTPUT_DIR: ${{ runner.temp }}/urc-playwright
          QA_ACTION_RUN_LABEL: browser-production
          QA_ACTION_SHA: ${{ github.sha }}
          # Release evidence exercises the production build, not next dev
          # (handoff WP8): what CI proves must be what users get.
          PW_PROD_BUILD: '1'
          # Semantic findings are release failures, not report-only notes.
          QA_STRICT_AUDIT: '1'
      - name: Validate every mapped browser action from runtime results
        if: always()
        run: >-
          npx --no-install tsx scripts/ui-actions/validate.ts
          --scope browser
          --expect-sha "$GITHUB_SHA"
          --report "${{ runner.temp }}/urc-playwright-gallery/ui-action-run.json"
          --report "${{ runner.temp }}/urc-playwright/ui-action-run.json"
          --out "${{ runner.temp }}/ui-action-evidence-browser.json"
      - name: Retain exact-SHA browser action evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-action-evidence-browser-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/ui-action-evidence-browser.json
            ${{ runner.temp }}/urc-playwright-gallery/ui-action-run.json
            ${{ runner.temp }}/urc-playwright/ui-action-run.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: ${{ runner.temp }}/urc-playwright/report
          retention-days: 7

  migrations:
    # Readiness audit R0: replay the ENTIRE migration chain from an empty
    # disposable Postgres and assert grants, search_path, deterministic
    # ordering, sentinel totals, clamps, and empty-page behavior — including
    # sentinel-scale seeded data (10,050 rows) so the 10,001 cap is exercised
    # for real. Makes "the migrations produce the schema production should
    # have" a checked claim instead of a belief.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: tests/db/migration-chain.sh
        env:
          DATABASE_URL: postgres://postgres:test@localhost:55432/postgres

  auth-browser:
    # Keep the existing required PR check meaningful without exposing a Clerk
    # secret or test identity to pull-request-controlled source. The real
    # sign-in/sign-out lifecycle lives in auth-lifecycle.yml and runs only for
    # the exact revision already accepted onto protected main.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify proxy, route, bypass, and entitlement contracts without secrets
        run: npx --no-install vitest run src/__tests__/apiAuth.test.ts --no-file-parallelism --maxWorkers=1
