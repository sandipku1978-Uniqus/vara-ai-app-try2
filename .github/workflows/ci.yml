name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --no-file-parallelism --maxWorkers=1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev

  browser:
    # Deterministic Playwright acceptance: route smoke, neutral visitor,
    # Boolean journeys (SEC-facing calls are intercepted fixtures), and the
    # semantic census — against the PRODUCTION build (PW_PROD_BUILD).
    # Release finding F-04: Vercel promoted revisions whose browser behaviour
    # was never exercised in CI.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: 'true'
          QA_OUTPUT_DIR: ${{ runner.temp }}/urc-playwright
          # Release evidence exercises the production build, not next dev
          # (handoff WP8): what CI proves must be what users get.
          PW_PROD_BUILD: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: ${{ runner.temp }}/urc-playwright/report
          retention-days: 7
