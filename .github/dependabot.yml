# Dependency update automation (remediation handoff WP6).
# Production-dependency security updates are the priority; grouped weekly
# batches keep PR noise low enough to actually review.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-security:
        applies-to: security-updates
        dependency-type: production
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      # react and react-dom must move as a unit, and their @types with them.
      # Ungrouped, dependabot proposed react-dom 19 while react stayed 18
      # (#52): npm rejects that outright with ERESOLVE, because
      # @types/react-dom@19 peer-requires @types/react@^19. A PR that can
      # never go green is pure noise -- group them so a React 19 proposal at
      # least installs and can be evaluated on its merits.
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # ESLint 10 removed the context.getFilename() API. eslint-config-next
      # pulls eslint-plugin-react ^7.37.0, and 7.37.5 (the latest release)
      # still calls it -- so `eslint .` dies loading react/display-name
      # before it lints a single file (#51). eslint-plugin-react does not yet
      # declare an ESLint 10 peer range at all.
      # UNBLOCK WHEN: eslint-plugin-react ships a release whose peer range
      # includes eslint 10 AND eslint-config-next depends on it. Then delete
      # this entry -- minor/patch eslint updates still flow through today.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # @types/node must track the Node runtime CI actually uses (20 for the
      # main jobs, 22 for the accuracy gate), not npm's latest. Dependabot
      # proposed 26.x (#67, 2026-08-02), which types APIs the runners don't
      # have and misses deprecations they enforce.
      # UNBLOCK WHEN: the workflows' setup-node versions move to a new major —
      # bump @types/node to that major in the same PR and delete this entry.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint refuses TS 7 outright: `npm run lint` dies with
      # "typescript-eslint does not support TS 7.0" (#68, 2026-08-02).
      # eslint-config-next pins typescript-eslint ^8.46, which has no TS 7
      # range yet — nothing in this repo can fix that.
      # UNBLOCK WHEN: typescript-eslint ships TS 7 support AND
      # eslint-config-next depends on that release. Minors still flow.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # jsdom 30's fetch internals call webidl.util.markAsUncloneable, which
      # does not exist on the verify job's Node 20 — every vitest fork worker
      # dies at startup (#69, 2026-08-02). Needs the runner's Node, not code.
      # UNBLOCK WHEN: the workflows' setup-node moves to >=22 — bump jsdom in
      # the same PR and delete this entry.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
